<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Almacén LinkTV</title>
    <style>
        body { font-family: sans-serif; margin: 40px; background: #f4f4f9; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #007bff; color: white; }
        .container { max-width: 800px; margin: auto; }
        input, button { padding: 10px; margin: 5px 0; }
        button { background: #28a745; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 Inventario de Equipos - LinkTV</h1>
        
        <h3>Agregar Nuevo Equipo</h3>
        <input type="text" id="equipo" placeholder="Ej: CCR2116">
        <input type="text" id="marca" placeholder="Ej: MikroTik">
        <input type="number" id="stock" placeholder="Cantidad">
        <button onclick="agregar()">Guardar en Almacén</button>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Equipo</th>
                    <th>Marca</th>
                    <th>Stock</th>
                </tr>
            </thead>
            <tbody id="tabla-body"></tbody>
        </table>
    </div>

    <script>
        async function cargarInventario() {
            const res = await fetch('/inventario');
            const datos = await res.json();
            const body = document.getElementById('tabla-body');
            body.innerHTML = datos.map(item => `
                <tr>
                    <td>${item.id}</td>
                    <td>${item.equipo}</td>
                    <td>${item.marca}</td>
                    <td>${item.stock}</td>
                </tr>
            `).join('');
        }

        async function agregar() {
            const equipo = document.getElementById('equipo').value;
            const marca = document.getElementById('marca').value;
            const stock = document.getElementById('stock').value;

            await fetch('/agregar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ equipo, marca, stock })
            });
            
            alert('Equipo agregado');
            cargarInventario();
        }

        cargarInventario();
    </script>
</body>
</html>
